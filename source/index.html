<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سنّ | إدارة عيادة الأسنان</title><style>
:root{--a:#24e3cf;--bg:#071411;--card:#10221e;--mut:#9bb6ae;--line:#234038}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eefaf6;font:15px Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:var(--a);color:#06221c;border:0;border-radius:10px;padding:12px 18px;font-weight:bold}button.secondary{background:#19352d;color:#d5ebe3}button.danger{background:#512e33;color:#ffc7ce}input,select,textarea{width:100%;background:#081a14;border:1px solid var(--line);color:white;border-radius:9px;padding:12px;margin-top:8px}label{display:block;color:var(--mut);font-size:13px;margin:12px 0}h1,h2,h3,p{margin-top:0}p{line-height:1.9;color:var(--mut)}small{color:var(--mut)}.brand{font-size:35px;color:var(--a);font-weight:bold}.logo{display:inline-grid;place-items:center;border:1px solid #3a7262;width:45px;height:45px;border-radius:14px;margin-left:12px;font-size:25px}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(90deg,#071411b0,#071411de),url(identity.jpg) center/cover}.intro{padding:13vh 9vw}.intro h1{font-size:48px;line-height:1.5;margin-top:40px}.intro em{color:var(--a);font-style:normal}.loginbox{align-self:center;margin:40px;max-width:440px;background:#091813e8;border:1px solid #31624f;border-radius:24px;padding:36px}.pill{display:inline-block;background:#173d30;color:var(--a);padding:7px 12px;border-radius:30px;font-size:12px}.demo{background:#173026;border:1px dashed #365a4c;padding:14px;border-radius:10px;margin-top:22px;font-size:12px;line-height:2}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:#091a14;border-left:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:12px}.nav{background:none;color:var(--mut);text-align:right;font-weight:normal;width:100%}.nav.active{background:#163d30;color:var(--a)}main{padding:30px 38px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}.stat{font-size:33px;margin-top:18px;display:block}.hero{background:linear-gradient(90deg,#091e18d9,#123d31c9),url(identity.jpg) center/cover;border-radius:18px;padding:30px;margin-bottom:22px;border:1px solid #28634e}.hero h2{font-size:29px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:right;white-space:nowrap}th{color:var(--mut);font-size:12px;font-weight:normal}td,th{padding:17px 12px;border-bottom:1px solid var(--line)}td button{padding:8px 12px;font-size:12px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.grow{flex:1}.section{margin-top:25px}.avatar{width:38px;height:38px;border-radius:12px;background:#225943;color:var(--a);display:grid;place-items:center}.badge{padding:6px 10px;background:#1c3e30;border-radius:8px;color:#73e6bd;font-size:12px}.badge.wait{background:#463d24;color:#ebce7b}.note{font-size:12px;color:#efcd84;background:#29281c;padding:10px 14px;border-radius:8px;margin-bottom:20px}.empty{text-align:center;padding:40px;color:var(--mut)}dialog{background:#10221e;color:white;border:1px solid #3b6556;border-radius:20px;max-width:850px;width:90%;padding:25px}dialog::backdrop{background:#000b}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.teeth{display:grid;grid-template-columns:repeat(16,1fr);gap:6px;direction:ltr;margin:20px 0}.tooth{padding:10px 0;border:1px solid #396d59;background:#143327;color:white;border-radius:8px;font-size:11px}.tooth b{display:block;font-size:23px}.tooth.changed{background:#655631;border-color:#e0bc59}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}.error{color:#ffb3b3;padding:12px 0}.toast{position:fixed;bottom:25px;left:25px;background:#d3fff1;color:#0c3528;padding:15px 25px;border-radius:12px;z-index:9}.mobilebrand{display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:170px 1fr}main{padding:20px}.teeth{grid-template-columns:repeat(8,1fr)}}@media(max-width:650px){.login{grid-template-columns:1fr}.intro{padding:35px 25px}.intro h1{font-size:30px;margin:20px 0}.loginbox{margin:20px}.shell{display:block}.sidebar{position:static;flex-direction:row;overflow:auto;padding:12px}.sidebar .brand,.sidebar .footer{display:none}.nav{white-space:nowrap;width:auto}.top{align-items:flex-start}.grid,.split,.formgrid{grid-template-columns:1fr}.mobilebrand{display:block}.teeth{grid-template-columns:repeat(8,1fr)}h1{font-size:24px}}
.modulehero{display:flex;justify-content:space-between;align-items:center;padding:30px;margin-bottom:26px;background:linear-gradient(110deg,#09231adc,#133d2cbf),url(identity.jpg) center/cover;border:1px solid #2b5f4c;border-radius:20px}.overview{display:grid;gap:8px;text-align:center;padding:20px 40px;background:#071a1399;border-radius:15px}.overview b{font-size:38px;color:var(--a)}.modulegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.module{display:flex;align-items:stretch;gap:0;padding:0;text-align:right;background:#10251d;color:white;border:1px solid #285442;min-height:113px;overflow:hidden;border-radius:13px;transition:transform .15s,border-color .15s}.module:hover{transform:translateY(-3px);border-color:var(--a)}.moduleicon{width:82px;min-width:82px;display:grid;place-items:center;color:white;font-size:35px}.moduletext{padding:22px 16px;flex:1}.moduletext strong{display:block;font-size:15px;margin-bottom:9px}.moduletext small{display:block;font-size:11px;line-height:1.8;font-weight:normal}.modulearrow{align-self:center;padding-left:13px;color:var(--a)}@media(max-width:1100px){.modulegrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.modulegrid{grid-template-columns:1fr}.modulehero{padding:20px}.overview{padding:14px}.moduleicon{width:70px;min-width:70px}}.phonewrap{display:flex;align-items:center;background:#081a14;border:1px solid var(--line);border-radius:9px;margin-top:8px;overflow:hidden}.phoneprefix{color:var(--a);padding:12px 15px;border-right:1px solid var(--line);font-weight:bold;white-space:nowrap}.phonewrap input{margin:0;border:0;border-radius:0;direction:ltr;min-width:0}.phonewrap+small{display:block;margin-top:8px;line-height:1.8}.editorbar{padding:12px;margin-bottom:20px;border:1px dashed #38775e;border-radius:12px}.editableText{outline:1px dashed var(--a);outline-offset:4px;cursor:text}.editableText:hover{background:#21533b}.photopair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.photopair img{display:block;width:100%;max-height:350px;object-fit:contain;background:#061610;border-radius:12px;margin-bottom:10px}.invoicepaper{background:white;color:#111;padding:25px;border-radius:12px;margin-top:18px}.invoicepaper p,.invoicepaper small,.invoicepaper th{color:#444}.invoicepaper td,.invoicepaper th{border-color:#ddd}.invoicepaper h2{color:#125d4a}@media(max-width:650px){.photopair{grid-template-columns:1fr}}@font-face{font-family:ClinicFont;src:url('/assets/ClinicFont.ttf') format('truetype');font-display:swap}.toothoption{margin:10px 0}.tabs{position:sticky;top:0;background:var(--card);padding:12px;z-index:2;flex-wrap:wrap}[hidden]{display:none!important}.statecolorrow,.methodrow{margin:14px 0}.photoUploadSlot{padding:25px;border:2px dashed #39705b;border-radius:14px;text-align:center}.patientavatar{width:72px;height:72px;object-fit:cover;border-radius:50%;border:2px solid var(--a)}.chatlog{max-height:350px;overflow:auto;margin:15px 0}.chatbubble{padding:15px;border-radius:12px;margin:10px;background:#193529}.chatbubble.mine{background:#225543}.moduleSetting input,.customSectionRow input{min-width:160px}@media(max-width:650px){.module{grid-column:auto!important}}@media(max-width:650px){.formgrid>label{grid-column:span 1!important}.field-layout-tools{flex-wrap:wrap}.field-layout-tools button{padding:6px;font-size:12px}}
</style><div id="app"></div><dialog id="modal"></dialog><script src="/assets/three.min.js"></script><script src="/assets/xlsx.full.min.js"></script><script src="/assets/jspdf.umd.min.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Baghdad'});const initial={"users":[{"id":1,"name":"مدير العيادة","username":"admin","password":"SET_A_UNIQUE_PASSWORD","role":"admin"},{"id":2,"name":"د. أحمد علي","username":"doctor","password":"SET_A_UNIQUE_PASSWORD","role":"doctor"},{"id":3,"name":"سارة • الاستقبال","username":"reception","password":"SET_A_UNIQUE_PASSWORD","role":"reception"}],"patients":[],"appointments":[]};let db;try{db=JSON.parse(localStorage.getItem('dentalDemoV1'))||structuredClone(initial)}catch{db=structuredClone(initial)}if(!db.adminRecoveryV5){let admin=db.users.find(u=>u.id===1)||db.users.find(u=>u.role==='admin');if(admin){admin.username='admin';admin.password='SET_A_UNIQUE_PASSWORD';admin.role='admin';admin.email='owner@example.invalid'}db.adminRecoveryV5=true;db.settings ||= {};db.settings.primaryEmail='owner@example.invalid';localStorage.setItem('dentalDemoV1',JSON.stringify(db))} let user=null,page='dashboard',query='',dateFilter=today(),selected=null;const roleNames={admin:'مدير العيادة',doctor:'طبيب',reception:'استقبال'};const save=()=>{localStorage.setItem('dentalDemoV1',JSON.stringify(db));scheduleCloudSave()};const doctors=()=>db.users.filter(u=>u.role==='doctor'&&!u.disabled);const patients=()=>db.patients.filter(p=>user.role!=='doctor'||p.doctor===user.id||db.appointments.some(a=>a.patient===p.id&&a.doctor===user.id));const appointments=()=>db.appointments.filter(a=>user.role!=='doctor'||a.doctor===user.id);const getp=id=>db.patients.find(p=>p.id===+id),getd=id=>db.users.find(u=>u.id===+id);const money=n=>db.settings?.language==='en'?Number(n).toLocaleString('en-US')+' IQD':Number(n).toLocaleString('ar-IQ')+' د.ع';function toast(t){let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),2600)}function login(){ $('#app').innerHTML=`<div class="login"><section class="intro"><div class="brand"><span class="logo">♧</span>سنّ</div><span class="pill" style="margin-top:30px">نظام إدارة عيادة الأسنان</span><h1>كل تفاصيل عيادتك.<br><em>بمكان واحد.</em></h1><p>من أول حجز إلى آخر جلسة.<br>مرضى، أطباء، ومواعيد بترتيب واضح.</p><div class="row"><span class="pill">ملفات المرضى</span><span class="pill">مخطط الأسنان</span><span class="pill">إدارة الحجوزات</span></div></section><section class="loginbox"><h2>أهلاً بعودتك</h2><p>سجّل الدخول إلى مساحة عملك</p><form id="loginform"><label>اسم المستخدم<input name="username" required autocomplete="username" placeholder="اسم المستخدم" dir="ltr"></label><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password" placeholder="••••••••" dir="ltr"></label><div id="loginerror" class="error"></div><button style="width:100%">دخول إلى العيادة ←</button></form><div class="demo"><b>حسابات تجريبية</b><br>مدير: admin / SET_A_UNIQUE_PASSWORD<br>طبيب: doctor / SET_A_UNIQUE_PASSWORD · استقبال: reception / SET_A_UNIQUE_PASSWORD<br>نسخة محلية للتجربة. لا تُدخل بيانات مرضى حقيقية.</div></section></div>`;$('#loginform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);user=db.users.find(u=>u.username===f.get('username')&&u.password===f.get('password'));if(!user){$('#loginerror').textContent='اسم المستخدم أو كلمة المرور غير صحيحة';return}render()}}
function render(){const titles={dashboard:'لوحة التحكم',patients:'المرضى',appointments:'الحجوزات',users:'الفريق والحسابات'};$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand" style="margin-bottom:30px"><span class="logo">♧</span>سنّ</div>${Object.entries(titles).filter(([k])=>k!=='users'||user.role==='admin').map(([k,v])=>`<button class="nav ${page===k?'active':''}" onclick="navigate('${k}')">${{dashboard:'◫',patients:'♙',appointments:'▦',users:'⚙'}[k]} &nbsp; ${v}</button>`).join('')}<div class="footer" style="margin-top:auto"><p>مساحة عيادتك<br><small>نسخة تجريبية 3.0</small></p></div><button class="nav" onclick="user=null;page='dashboard';login()">تسجيل خروج ↗</button></aside><main><div class="top"><div><small>عيادة الأسنان / ${titles[page]}</small><h1 style="margin:10px 0">${titles[page]}</h1></div><div class="row"><div class="avatar">${esc(user.name[0])}</div><div>${esc(user.name)}<br><small>${roleNames[user.role]}</small></div></div></div><div class="note">الحفظ السحابي • جاري فحص الاتصال</div><div id="content"></div></main></div>`;({dashboard:dashboard,patients:patientList,appointments:appointmentList,users:userList}[page])()}
function navigate(p){page=p;query='';render()}function apptable(list){return list.length?`<div class="tablewrap"><table><thead><tr><th>المريض</th><th>الطبيب</th><th>الموعد</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody>${list.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(a=>`<tr><td>${esc(getp(a.patient)?.name)}<br><small>${esc(a.reason)}</small></td><td>${esc(getd(a.doctor)?.name)}</td><td dir="ltr">${esc(a.date)} · ${esc(a.time)}<br><small>${a.duration} دقيقة</small></td><td><span class="badge ${a.status==='بانتظار التأكيد'?'wait':''}">${esc(a.status)}</span></td><td><button class="secondary" onclick="appointmentForm(${a.id})">تعديل</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد مواعيد في هذا اليوم</div>'}
function dashboard(){let ap=appointments().filter(a=>a.date===today());$('#content').innerHTML=`<div class="hero"><span class="pill">${new Date().toLocaleDateString('ar-IQ',{timeZone:'Asia/Baghdad',weekday:'long',day:'numeric',month:'long'})}</span><h2 style="margin:18px 0 8px">يوم مرتب، رعاية أفضل.</h2><p>تابع مواعيدك وملفات المرضى من مساحة واحدة.</p><button onclick="appointmentForm()">+ حجز جديد</button></div><div class="grid">${[['مواعيد اليوم',ap.filter(a=>a.status!=='ملغي').length],['إجمالي المرضى',patients().length],['بانتظار التأكيد',ap.filter(a=>a.status==='بانتظار التأكيد').length],['الأطباء',user.role==='doctor'?1:doctors().length]].map(([t,n])=>`<div class="card"><small>${t}</small><b class="stat">${n}</b></div>`).join('')}</div><div class="card section"><div class="row"><h3 class="grow">مواعيد اليوم</h3><button class="secondary" onclick="navigate('appointments')">عرض الكل ←</button></div>${apptable(ap)}</div>`}
function patientList(){let list=patients().filter(p=>(p.name+p.phone+p.id).includes(query));$('#content').innerHTML=`<div class="row"><input class="grow" style="margin:0" placeholder="ابحث بالاسم، رقم الهاتف أو رقم الملف…" value="${esc(query)}" oninput="query=this.value;patientRows()"><button onclick="patientForm()">+ مريض جديد</button></div><div class="card section" id="patientsTable"></div>`;patientRows()}function patientRows(){let list=patients().filter(p=>(p.name+p.phone+p.id).includes(query));$('#patientsTable').innerHTML=list.length?`<div class="tablewrap"><table><thead><tr><th>رقم الملف</th><th>المريض</th><th>رقم الهاتف</th><th>الطبيب</th><th>الحالة</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td>#${p.id}</td><td>${esc(p.name)}<br><small>${p.age} سنة</small></td><td dir="ltr">${esc(p.phone)}</td><td>${esc(getd(p.doctor)?.name)}</td><td><span class="badge">${esc(p.status)}</span></td><td><button class="secondary" onclick="patientFile(${p.id})">فتح الملف ←</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد نتائج</div>'}
function openModal(html){$('#modal').innerHTML=`<div class="row"><span class="grow"></span><button class="secondary" onclick="document.querySelector('#modal').close()">✕ إغلاق</button></div>${html}`;if(!$('#modal').open)$('#modal').showModal()}const options=(list,value)=>list.map(x=>`<option value="${x.id}" ${+value===x.id?'selected':''}>${esc(x.name)}</option>`).join('');
function patientForm(id){let p=id?getp(id):{};openModal(`<h2>${id?'تعديل بيانات المريض':'مريض جديد'}</h2><form id="pf"><div class="formgrid"><label>اسم المريض<input name="name" value="${esc(p.name)}" required></label><label>رقم الهاتف<input name="phone" value="${esc(p.phone)}" required pattern="[+0-9 ()-]{7,20}" dir="ltr"></label><label>العمر<input name="age" type="number" min="0" max="120" value="${p.age??''}" required></label><label>الطبيب<select name="doctor">${options(user.role==='doctor'?[user]:doctors(),p.doctor)}</select></label><label>حالة الملف<select name="status">${['قيد العلاج','متابعة','مكتمل'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></label>${user.role!=='reception'?`<label>الحساسية<input name="allergy" value="${esc(p.allergy)}"></label><label>التاريخ المرضي<textarea name="medical">${esc(p.medical)}</textarea></label><label>ملاحظات<textarea name="notes">${esc(p.notes)}</textarea></label>`:''}</div><button>حفظ بيانات المريض</button></form>`);$('#pf').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.doctor=+f.doctor;f.age=+f.age;if(id)Object.assign(p,f);else db.patients.push({...f,id:Math.max(1000,...db.patients.map(x=>x.id))+1,teeth:{},visits:[]});save();$('#modal').close();render();toast('تم حفظ المريض')}}
function patientFile(id){let p=getp(id);if(!patients().some(x=>x.id===id))return;selected=id;if(user.role==='reception'){openModal(`<h2>${esc(p.name)}</h2><p>رقم الملف #${p.id} · ${esc(p.phone)}</p><p>الطبيب: ${esc(getd(p.doctor)?.name)}<br>البيانات العلاجية متاحة للطبيب فقط.</p><button onclick="patientForm(${id})">تعديل بيانات التواصل</button>`);return}let sum=p.visits.reduce((s,v)=>s+v.cost,0),paid=p.visits.reduce((s,v)=>s+v.paid,0);openModal(`<h2>${esc(p.name)} <small>#${p.id}</small></h2><p>${p.age} سنة · <span dir="ltr">${esc(p.phone)}</span> · ${esc(getd(p.doctor)?.name)}</p><div class="row"><button class="secondary" onclick="patientForm(${id})">تعديل الملف</button><button onclick="visitForm(${id})">+ جلسة علاج</button></div><div class="split section"><div class="card"><small>الحساسية</small><p>${esc(p.allergy)||'غير مسجل'}</p><small>التاريخ المرضي</small><p>${esc(p.medical)||'غير مسجل'}</p><small>ملاحظات</small><p>${esc(p.notes)||'لا توجد ملاحظات'}</p></div><div class="card"><small>إجمالي العلاج</small><h2>${money(sum)}</h2><p>المدفوع: ${money(paid)}<br>المتبقي: ${money(sum-paid)}</p></div></div><h3 class="section">مخطط الأسنان • ترقيم FDI</h3><small>الأسنان الدائمة — اضغط على السن لتسجيل حالته</small><div class="teeth">${[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28,48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38].map(n=>`<button class="tooth ${p.teeth[n]&&p.teeth[n]!=='سليم'?'changed':''}" onclick="toothForm(${id},${n})" title="${esc(p.teeth[n]||'سليم')}"><b>♧</b>${n}</button>`).join('')}</div><div class="row">${Object.entries(p.teeth).map(([n,s])=>`<span class="badge">${n}: ${esc(s)}</span>`).join('')}</div><h3 class="section">سجل الجلسات والعلاج</h3>${p.visits.length?`<div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>السن</th><th>العلاج والملاحظات</th><th>الكلفة</th><th>المدفوع</th></tr></thead><tbody>${[...p.visits].reverse().map(v=>`<tr><td>${esc(v.date)}</td><td>${esc(v.tooth)}</td><td>${esc(v.treatment)}<br><small>${esc(v.note)}</small></td><td>${money(v.cost)}</td><td>${money(v.paid)}</td></tr>`).join('')}</tbody></table></div>`:'<p>لم تسجل جلسات بعد.</p>'}`)}
function toothForm(id,n){let p=getp(id);openModal(`<h2>السن ${n}</h2><form id="tf"><label>حالة السن<select name="state">${['سليم','تسوس','حشوة','علاج عصب','تاج','مفقود','زرعة','يحتاج فحص'].map(s=>`<option ${p.teeth[n]===s?'selected':''}>${s}</option>`).join('')}</select></label><button>حفظ حالة السن</button></form>`);$('#tf').onsubmit=e=>{e.preventDefault();p.teeth[n]=new FormData(e.target).get('state');save();patientFile(id);toast('تم تحديث حالة السن')}}

function phoneDigits(value){return String(value).replace(/[٠-٩۰-۹]/g,c=>String(c.charCodeAt(0)>1775?c.charCodeAt(0)-1776:c.charCodeAt(0)-1632)).replace(/[\s()+\-\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'')}
normalizePhone=function(value){let n=phoneDigits(value);if(n.startsWith('00'))n=n.slice(2);if(n.startsWith('964'))n=n.slice(3);if(n.startsWith('0'))n=n.slice(1);return /^7\d{9}$/.test(n)?'964'+n:null};
function localPhone(value){let normalized=normalizePhone(value);return normalized?normalized.slice(3):String(value||'')}
function prefixPhoneInput(input){input.value=localPhone(input.value);input.type='tel';input.inputMode='tel';input.placeholder='770SET_A_UNIQUE_PASSWORD7';input.removeAttribute('pattern');input.setAttribute('aria-label','رقم الهاتف العراقي بدون مفتاح الدولة');let wrap=document.createElement('div');wrap.className='phonewrap';wrap.dir='ltr';let prefix=document.createElement('span');prefix.className='phoneprefix';prefix.textContent='+964';input.parentNode.insertBefore(wrap,input);wrap.append(prefix,input);let help=document.createElement('small');help.textContent='اكتب 770SET_A_UNIQUE_PASSWORD7 أو 0770SET_A_UNIQUE_PASSWORD7 — مفتاح العراق مضاف تلقائياً';wrap.after(help)}

let cloudReady=false,cloudRevision=0,cloudQueue=Promise.resolve(),cloudBlocked=false,cloudMessage='جاري الاتصال بقاعدة البيانات…';

function scheduleCloudSave(){if(!cloudReady||cloudBlocked)return;let snapshot=JSON.parse(JSON.stringify(db));cloudMessage='جاري حفظ التغييرات…';cloudIndicator();cloudQueue=cloudQueue.then(async()=>{if(cloudBlocked)return;try{let r=await fetch('/api/clinic-state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:cloudRevision,data:snapshot})});if(!r.ok)throw new Error(r.status===409?'تعارض تعديل من جهاز آخر. حدّث الصفحة قبل المتابعة.':'تعذر الحفظ السحابي. التغييرات باقية محلياً فقط.');let d=await r.json();cloudRevision=d.revision;cloudMessage='محفوظ في قاعدة البيانات';cloudIndicator()}catch(e){cloudBlocked=true;cloudMessage=e.message;cloudIndicator();toast(cloudMessage)}})}
async function initializeCloud(){let form=$('#loginform'),button=form?.querySelector('button');if(button)button.disabled=true;let local=JSON.parse(JSON.stringify(db));try{let r=await fetch('/api/clinic-state',{cache:'no-store'});if(!r.ok)throw Error(r.status===403?'حسابك غير مضاف أو معطل في هذه العيادة. اطلب من المدير إضافة بريدك.':r.status===401?'سجّل الدخول بحسابك المرتبط بالعيادة أولاً.':'تعذر الاتصال بقاعدة البيانات');let result=await r.json();cloudRevision=result.revision;if(result.data){db=result.data;localStorage.setItem('dentalDemoV1',JSON.stringify(db));cloudMessage='تم تحميل البيانات من قاعدة البيانات'}else{cloudMessage='قاعدة البيانات جاهزة • سيتم حفظ بيانات هذا المتصفح';}db.settings ||= {};db.settings.primaryEmail='owner@example.invalid';let administrator=db.users.find(u=>u.id===1)||db.users.find(u=>u.role==='admin');if(administrator)administrator.email='owner@example.invalid';cloudReady=true;cloudBlocked=false;login();if(!result.data){scheduleCloudSave();await cloudQueue}let demo=$('.demo');if(demo)demo.innerHTML='<b>تهيئة حساب المدير مطلوبة قبل الاستخدام</b><br>البيانات مرتبطة بقاعدة Supabase لحساب owner@example.invalid.<br>الحسابات الداخلية ما زالت للتجربة، لاستخدامك الخاص فقط.';let status=document.createElement('p');status.textContent=cloudMessage;status.style.fontSize='12px';status.style.display='none';$('.loginbox').append(status)}catch(e){db=local;cloudBlocked=true;cloudMessage=e.message||'الاتصال السحابي غير متاح. الدخول متوقف لتجنب العمل على بيانات قديمة.';if(button)button.disabled=true;$('#loginerror').textContent=cloudMessage;let signIn=document.createElement('a');signIn.href='/signin-with-chatgpt?return_to=%2F';signIn.target='_top';signIn.textContent='تسجيل الدخول بحسابك المسجل بالعيادة';signIn.style.cssText='display:block;color:var(--a);margin:15px 0';$('.loginbox').append(signIn);let retry=document.createElement('button');retry.type='button';retry.className='secondary';retry.textContent='إعادة محاولة الاتصال';retry.onclick=()=>location.relo const settingsBeforeBackup=settingsPage;settingsPage=function(){settingsBeforeBackup();if(user.role!=='admin')return;let c=document.createElement('div');c.className='card section';c.innerHTML='<h3>النسخ الاحتياطية والاسترجاع</h3><p>تُحفظ نسخة مشفرة تلقائياً قبل كل تغيير سحابي. الاسترجاع يحفظ الحالة الحالية أولاً، ثم يرجع كل بيانات العيادة إلى النسخة المختارة، بما فيها الحسابات والصور.</p><button onclick="backupsDialog()">عرض النسخ الاحتياطية</button>';$('#content').append(c)};
async function backupRequest(action,revision){let r=await fetch('/api/backups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,revision,currentRevision:cloudRevision,username:user.username,password:user.password})});if(!r.ok)throw Error(r.status===409?'تغيّرت البيانات. حدّث الصفحة أولاً.':r.status===403?'هذا الإجراء يحتاج حساب مدير مطابقاً للحساب المحفوظ سحابياً.':'تعذر الوصول للنسخ الاحتياطية');return r.json()}
async function backupsDialog(){if(user.role!=='admin')return;openModal('<h2>النسخ الاحتياطية</h2><p id="backupStatus">جاري تحميل النسخ…</p><div id="backupList"></div>');try{await cloudQueue;if(cloudBlocked)throw Error('أكمل الحفظ السحابي أولاً قبل الاسترجاع');let result=await backupRequest('list');$('#backupStatus').textContent='آخر 100 نسخة محفوظة — توقيت بغداد';$('#backupList').innerHTML=result.backups.length?result.backups.map(b=>`<div class="row" style="padding:15px;border-bottom:1px solid var(--line)"><span class="grow">نسخة #${b.revision}<br><small>${new Date(b.saved_at).toLocaleString('ar-IQ',{timeZone:'Asia/Baghdad'})}</small></span><button class="secondary" onclick="confirmRestore(${b.revision})">استرجاع</button></div>`).join(''):'<p>ماكو نسخ أقدم بعد. تبدأ النسخ عند أول تعديل على البيانات المحفوظة.</p>'}catch(e){$('#backupStatus').textContent=e.message}}
function confirmRestore(revision){openModal(`<h2>استرجاع نسخة #${revision}</h2><p>راح ترجع المرضى والحجوزات والجلسات والحسابات إلى هذه النسخة. الحالة الحالية تنحفظ قبل الاسترجاع. إذا كانت كلمة سر المدير مختلفة بتلك النسخة، تحتاج تستخدمها بعد الاسترجاع.</p><label>اكتب «استرجاع» للتأكيد<input id="restoreConfirmation"></label><div id="restoreError" class="error"></div><button class="danger" id="restoreButton" onclick="restoreBackup(${revision})">استرجاع كل البيانات</button>`)}

const bookingBeforeFinance=appointmentForm;appointmentForm=function(id){bookingBeforeFinance(id);let form=$('#af');if(!form)return;let a=db.appointments.find(a=>a.id===id)||{},area=document.createElement('div');area.className='formgrid';area.innerHTML=`<label>الكلفة المتفق عليها للحجز (د.ع)<input type="number" name="cost" min="0" step="1" value="${Number(a.cost||0)}" required></label><label>المبلغ المستلم للحجز (د.ع)<input type="number" name="paid" min="0" step="1" value="${Number(a.paid||0)}" required></label><label>المتبقي<input id="bookingRemaining" readonly value="${money(Number(a.cost||0)-Number(a.paid||0))}"></label>`;form.insertBefore(area,$('#aerror'));let cost=form.querySelector('[name="cost"]'),paid=form.querySelector('[name="paid"]');const recalc=()=>$('#bookingRemaining').value=money(Number(cost.value)-Number(paid.value));cost.oninput=paid.oninput=recalc;let submit=form.onsubmit;form.onsubmit=e=>{if(!Number.isFinite(+cost.value)||!Number.isFinite(+paid.value)||+paid.value>+cost.value||+cost.value<0||+paid.value<0){e.preventDefault();$('#aerror').textContent='المستلم يجب أن يكون بين صفر والكلفة المتفق عليها';return}submit(e)};if(user.role==='admin'){let add=document.createElement('button');add.type='button';add.className='secondary';add.textContent='+ إضافة طبيب أثناء الحجز';add.onclick=()=>inlineDoctor(form);form.querySelector('[name="doctor"]').parentElement.append(add)}};

const tableBeforeFinance=apptable;apptable=function(list){let html=tableBeforeFinance(list);if(!list.length)return html;html=html.replace('<th>الحالة</th>','<th>المستلم / المتبقي</th><th>الحالة</th>');for(let a of list){let marker=`<td><span class="badge ${a.status==='بانتظار التأكيد'?'wait':''}">${esc(a.status)}</span>`;html=html.replace(marker,`<td>${money(Number(a.paid||0))}<br><small>المتبقي: ${money(Number(a.cost||0)-Number(a.paid||0))}</small></td>`+marker);html=html.replace(`appointmentForm(${a.id})">تعديل</button>`,`appointmentForm(${a.id})">تعديل</button> <button class="secondary" onclick="patientFile(${a.patient})">ملف المريض والصور</button> <button class="secondary" onclick="invoiceDialog(${a.patient},${a.id})">فاتورة / وصل</button>`)}return html};
patientFile=function(id){let p=getp(id);if(!p||!patients().some(p=>p.id===id))return;selected=id;let f=patientFinance(p),bookings=appointments().filter(a=>a.patient===id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));openModal(`<h2>${esc(p.name)} <small>#${p.id}</small></h2><p>${p.age} سنة · <span dir="ltr">${esc(p.phone)}</span> · ${esc(getd(p.doctor)?.name)}</p><div class="row"><button class="secondary" onclick="patientForm(${id})">تعديل بيانات المريض</button>${user.role!=='reception'?`<button onclick="visitForm(${id})">+ زيارة / جلسة علاج</button>`:''}<button class="secondary" onclick="invoiceDialog(${id})">كشف المريض / طباعة</button></div><div class="grid section">${[['الكلفة الكلية',f.cost],['المستلم',f.paid],['المتبقي',f.remaining]].map(([l,n])=>`<div class="card"><small>${l}</small><h3 style="margin-top:15px">${money(n)}</h3></div>`).join('')}</div>${user.role!=='reception'?`<div class="card section"><small>الحساسية</small><p>${esc(p.allergy)||'غير مسجل'}</p><small>التاريخ المرضي</small><p>${esc(p.medical)||'غير مسجل'}</p><small>ملاحظات المريض</small><p>${esc(p.notes)||'لا توجد ملاحظات'}</p></div><h3 class="section">مخطط الأسنان</h3><div class="teeth">${[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28,48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38].map(n=>`<button class="tooth ${p.teeth[n]&&p.teeth[n]!=='سليم'?'changed':''}" title="${esc(p.teeth[n]||'سليم')}" onclick="toothForm(${id},${n})"><b>♧</b>${n}</button>`).join('')}</div><h3>كل الزيارات والعلاجات</h3>${p.visits.length?p.visits.map((v,i)=>`<section class="card section"><div class="row"><h3 class="grow">${esc(v.date)} · ${esc(v.treatment)}</h3><button class="secondary" onclick="visitForm(${id},${i})">تعديل الزيارة</button><button class="secondary" onclick="photoEditor(${id},${i})">صور قبل وبعد</button></div><p>السن / المنطقة: ${esc(v.tooth)} · العيادة: ${esc(v.clinic||'غير محددة')}<br>${esc(v.note)}</p><small>${v.appointmentId?'مبالغ هذه الجلسة محسوبة بالحجز المرتبط':`الكلفة: ${money(v.cost visitForm=function(id,index){let p=getp(id);if(!p||user.role==='reception'||!patients().some(p=>p.id===id))return;let v=index===undefined?{}:p.visits[index],bookings=appointments().filter(a=>a.patient===id&&a.status!=='ملغي');openModal(`<h2>${index===undefined?'زيارة جديدة':'تعديل زيارة'}</h2><form id="vf"><div class="formgrid"><label>تاريخ الزيارة<input name="date" type="date" value="${v.date||today()}" required></label><label>العيادة<select name="clinic" required><option value="">اختر…</option>${dentalClinics.map(c=>`<option ${v.clinic===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>السن / المنطقة<input name="tooth" value="${esc(v.tooth)}" required></label><label>الإجراء / العلاج<input name="treatment" value="${esc(v.treatment)}" required></label><label>ربط الزيارة بحجز<select name="appointmentId"><option value="">زيارة مستقلة</option>${bookings.map(a=>`<option value="${a.id}" ${+v.appointmentId===a.id?'selected':''}>${esc(a.date)} ${esc(a.time)} — ${esc(a.clinic||'غير محددة')}</option>`).join('')}</select></label><label>كلفة الزيارة المستقلة<input name="cost" type="number" min="0" step="1" value="${Number(v.cost||0)}" required></label><label>مستلم الزيارة المستقلة<input name="paid" type="number" min="0" step="1" value="${Number(v.paid||0)}" required></label></div><p>عند ربط الزيارة بحجز، المبالغ تُحسب من الحجز فقط، حتى لا تتكرر.</p><label>شنو تم بكل زيارة؟ ملاحظات وخطة المتابعة<textarea name="note" rows="4">${esc(v.note)}</textarea></label><div id="verror" class="error"></div><button>حفظ الزيارة</button></form>`);let af=$('#vf').querySelector('[name="appointmentId"]');af.onchange=()=>{for(let n of ['cost','paid']){$('#vf').querySelector('[name="'+n+'"]').disabled=!!af.value}if(af.value){let a=bookings.find(a=>a.id===+af.value);if(a?.clinic)$('#vf').querySelector('[name="clinic"]').value=a.clinic}};af.onchange();$('#vf').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));data.appointmentId=data.appointmentI const photoCache=new Map();async function photoCall(payload){let r=await fetch('/api/patient-photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,username:user.username,password:user.password})});let d=await r.json();if(!r.ok)throw Error(r.status===403?'لا توجد صلاحية لهذه الصورة':r.status===413?'حجم الصورة كبير':'تعذر تحميل الصورة. تأكد من حفظ الزيارة والاتصال');return d}
async function loadPatientPhotos(){for(let img of document.querySelectorAll('img[data-photo-id]')){let id=img.dataset.photoId;try{let image=photoCache.get(id);if(!image){image=(await photoCall({action:'read',patient:+img.dataset.patient,visit:img.dataset.visit,id})).image;photoCache.set(id,image)}if(img.isConnected)img.src=image}catch(e){img.alt=e.message}}}
function photoEditor(id,index){let p=getp(id),v=p.visits[index];if(user.role==='reception')return;openModal(`<h2>صور الزيارة — ${esc(v.date)}</h2><p>${esc(p.name)} · ${esc(v.treatment)}</p><form id="photoForm"><label>نوع الصورة<select name="stage"><option value="before">قبل العلاج</option><option value="after">بعد العلاج</option></select></label><label>رفع صورة جديدة أو تبديل صورة<select name="replace"><option value="">صورة جديدة</option>${(v.photos||[]).map(ph=>`<option value="${ph.id}">${ph.stage==='before'?'قبل':'بعد'} — ${esc(ph.caption||ph.date)}</option>`).join('')}</select></label><label>وصف الصورة<input name="caption" maxlength="150"></label><label>اختر الصورة<input id="visitPhoto" type="file" accept="image/jpeg,image/png,image/webp" required></label><small>حتى 10 ميغابايت للصورة الأصلية. تُصغّر للعرض والحفظ.</small><div class="error" id="photoVisitError"></div><button id="uploadVisitPhoto">حفظ الصورة</button></form>`);$('#photoForm').onsubmit=async e=>{e.preventDefault();let form=e.target,f=Object.fromEntries(new FormData(form)),file=$('#visitPhoto').files[0],button=$('#uploadVisitPhoto');button.disabled=true;try{if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024)throw Error('اختر JPG أو PNG أو WebP بحجم لا يتجاوز 10 ميغابايت');await cloudQueue;if(cloudBlocked)throw Error('احفظ الزيارة سحابياً قبل رفع الصورة');let bitmap=await createImageBitmap(file),canvas=document.createElement('canvas'),scale=Math.min(1,1400/Math.max(bitmap.width,bitmap.height));canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();let image=canvas.toDataURL('image/jpeg',0.8);if(image.length>1800000)throw Error('الصورة بعد التصغير كبيرة. اختر صورة أصغر');let result=await photoCall({action:'upload',patient:id,visit:visitId(v,index),image});v.photos ||= [];let photo={id:result.id,stage:f.stage,caption:f.caption,date:today()};let old=v.photos.findIndex(ph=>ph.id===f.replace);if(old>=0)v.photos[old]=photo;else v.photos.push(photo);photoCache.set(result.id,image);save();await cloudQueue;if(cloudBlocked)throw Error('رفعت الصورة لكن حفظ ربطها بالزيارة لم يتأكد. لا تغلق الصفحة.');patientFile(id);toast('تم حفظ صورة الزيارة')}catch(err){$('#photoVisitError').textContent=err.message;button.disabled=false}}}

function patientLedger(p,appointmentId){let bookings=db.appointments.filter(a=>a.patient===p.id&&(a.status!=='ملغي'||Number(a.paid||0)>0)&&(!appointmentId||a.id===appointmentId));let rows=bookings.map(a=>({date:a.date,description:a.reason,clinic:a.clinic||'غير محددة',cost:Number(a.cost||0),paid:Number(a.paid||0),ref:'حجز #'+a.id}));if(!appointmentId)rows.push(...p.visits.filter(v=>!v.appointmentId).map(v=>({date:v.date,description:v.treatment,clinic:v.clinic||'غير محددة',cost:Number(v.cost||0),paid:Number(v.paid||0),ref:'جلسة'})));return rows.sort((a,b)=>a.date.localeCompare(b.date))}

function printInvoice(){let iframe=document.createElement('iframe');iframe.style.cssText='position:fixed;width:1px;height:1px;left:-9999px';document.body.append(iframe);let content=$('#invoicePreview').innerHTML;let doc=iframe.contentDocument;doc.open();doc.write('<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>فاتورة المريض</title><style>@page{size:A4;margin:18mm}body{font:14px Tahoma,Arial;color:#111}table{width:100%;border-collapse:collapse}th,td{text-align:right;border-bottom:1px solid #ddd;padding:12px}p{line-height:2}tr{break-inside:avoid}h2{color:#12644c}.photopair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.photopair img{display:block;width:100%;max-height:350px;object-fit:contain;background:#061610;border-radius:12px;margin-bottom:10px}.invoicepaper{background:white;color:#111;padding:25px;border-radius:12px;margin-top:18px}.invoicepaper p,.invoicepaper small,.invoicepaper th{color:#444}.invoicepaper td,.invoicepaper th{border-color:#ddd}.invoicepaper h2{color:#125d4a}@media(max-width:650px){.photopair{grid-template-columns:1fr}}</style><body>'+content+'</body></html>');iframe.onload=()=>{iframe.contentWindow.focus();iframe.contentWindow.print()};doc.close();setTimeout(()=>iframe.remove(),60000)}
function invoiceCanvas(p,rows,totals,pageNumber,pageCount){let canvas=document.createElement('canvas');canvas.width=1240;canvas.height=1754;let ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,1240,1754);ctx.direction='rtl';ctx.textAlign='right';ctx.fillStyle='#125d4a';ctx.font='bold 43px ClinicFont,Tahoma,Arial';ctx.fillText(db.settings.clinicName,1150,105);ctx.fillStyle='#222';ctx.font='bold 30px ClinicFont,Tahoma,Arial';ctx.fillText('فاتورة / كشف حساب',1150,165);ctx.font='25px ClinicFont,Tahoma,Arial';ctx.fillText('المريض: '+p.name+' — ملف #'+p.id,1150,230);ctx.fillText('الهاتف: '+p.phone,1150,280);ctx.fillText('تاريخ الإصدار: '+today(),1150,325);ctx.fillStyle='#e9f4ee';ctx.fillRect(80,370,1080,65);ctx.fillStyle='#222';ctx.font='bold 24px ClinicFont,Tahoma,Arial';ctx.fillText('التاريخ',1135,414);ctx.fillText('الخدمة / العيادة',920,414);ctx.fillText('الكلفة',380,414);ctx.fillText('المستلم',190,414);let y=480;ctx.font='22px ClinicFont,Tahoma,Arial';for(let r of rows){ctx.fillText(r.date,1135,y);let description=String(r.description);ctx.fillText(description,920,y,430);ctx.fillStyle='#555';ctx.fillText(r.clinic,920,y+35,430);ctx.fillStyle='#222';ctx.fillText(Number(r.cost).toLocaleString('ar-IQ'),380,y);ctx.fillText(Number(r.paid).toLocaleString('ar-IQ'),190,y);ctx.strokeStyle='#ddd';ctx.beginPath();ctx.moveTo(80,y+55);ctx.lineTo(1160,y+55);ctx.stroke();y+=105}if(pageNumber===pageCount){y=Math.max(y+40,1250);ctx.font='bold 28px ClinicFont,Tahoma,Arial';for(let [label,value] of [['إجمالي الكلفة',totals.cost],['المبلغ المستلم',totals.paid],['المتبقي',totals.cost-totals.paid]]){ctx.fillText(label+' : '+money(value),1150,y);y+=55}}ctx.fillStyle='#777';ctx.font='21px ClinicFont,Tahoma,Arial';ctx.fillText('المبالغ بالدينار العراقي — صفحة '+pageNumber+' من '+pageCount,1150,1665);return canvas}
async function downloadInvoicePDF(id,appointmentId){try{await document.fonts.load('28px ClinicFont');await document.fonts.ready;if(!window.jspdf?.jsPDF)throw Error('مكتبة PDF لم تتحمل. حدّث الصفحة.');let p=getp(id),rows=patientLedger(p,appointmentId),totals={cost:rows.reduce((s,r)=>s+r.cost,0),paid:rows.reduce((s,r)=>s+r.paid,0)},count=Math.max(1,Math.ceil(rows.length/7)),doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});for(let i=0;i<count;i++){if(i)doc.addPage();doc.addImage(invoiceCanvas(p,rows.slice(i*7,i*7+7),totals,i+1,count).toDataURL('image/jpeg',0.95),'JPEG',0,0,210,297)}doc.save('Patient-'+id+'-Invoice.pdf')}catch(e){$('#invoiceError').textContent=e.message}}

const fileBeforeTabs=patientFile;patientFile=function(id){let loader=loadPatientPhotos;loadPatientPhotos=()=>{};try{fileBeforeTabs(id)}finally{loadPatientPhotos=loader}if(!patients().some(p=>p.id===id))return;let modal=$('#modal'),tabbar=document.createElement('div');tabbar.className='tabs';let treatment=document.createElement('div'),photos=document.createElement('div'),account=document.createElement('div');treatment.id='patientTreatmentTab';photos.id='patientPhotosTab';account.id='patientAccountTab';let children=[...modal.children];let common=children.find(el=>el.classList.contains('row')&&el.querySelector('button[onclick^="patientForm"]'));if(!common)return;for(let child of children.slice(children.indexOf(common)+1))treatment.append(child);for(let pair of [...treatment.querySelectorAll('.photopair')]){let section=document.createElement('section');section.className='card section';let heading=document.createElement('h3');heading.textContent=pair.parentElement.querySelector('h3')?.textContent||'صور الزيارة';section.append(heading,pair);photos.append(section)}if(!photos.children.length){photos.innerHTML=user.role==='reception'?'<p>صور العلاج للطبيب والمدير فقط.</p>':'<p>أضف زيارة ثم اختر «صور قبل وبعد» لرفع الصور.</p>'}let summary=treatment.querySelector('.grid.section');if(summary)account.append(summary);let heading=document.createElement('h3');heading.textContent='المواعيد والدفعات';account.append(heading);let accountActions=document.createElement('div');accountActions.className='row';accountActions.innerHTML=`<button onclick="invoiceDialog(${id})">كشف الحساب / فاتورة</button>`;account.append(accountActions);for(let a of appointments().filter(a=>a.patient===id)){let box=document.createElement('section');box.className='card section';box.innerHTML=`<div class="row"><span class="grow">${esc(a.date)} ${esc(a.time)} · ${esc(a.clinic||'غير محددة')}<br><small>المستلم ${money(Number(a.paid||0))} · المتبقي ${money(Number(a.cost||0)-Number(a.paid||0))}</small></span><button o function jawReferenceDialog(){openModal('<h2>مرجع شكل الفك</h2><p>الصورة المرفوعة مرجع بصري ثابت. تدوير المجسم وتحديد حالة السن متاحان في العارض التوضيحي داخل ملف المريض.</p><img alt="مرجع الفك المرفوع من المستخدم" src="'+jawReferenceV15+'" style="display:block;width:100%;max-width:650px;margin:auto"><p>الصورة الأصلية تحمل علامة Pngtree.</p>');ensureBackButton()}
jawReferenceDialog=wrapBack(jawReferenceDialog);
const patientReferenceV15=patientFile;patientFile=function(id){patientReferenceV15(id);let tab=$('#patientTreatmentTab'),p=getp(id);if(!tab||!p||user.role==='reception')return;let button=document.createElement('button');button.className='secondary';button.textContent='عرض مرجع شكل الفك المرفوع';button.onclick=jawReferenceDialog;tab.prepend(button);let fields=db.settings.formCustomFields?.patient||[];if(fields.length){let box=document.createElement('section');box.className='card section';box.innerHTML='<h3>حقول المريض الإضافية</h3>'+fields.map(f=>'<p>'+esc(f.label)+': '+esc(p.customFields?.[f.id]||'غير مسجل')+'</p>').join('');tab.append(box)}};

function customFieldManager(){if(user.role!=='admin')return;openModal(`<h2>إدارة الحقول الإضافية</h2><p>إزالة الحقل من الواجهة لا تمسح القيم المحفوظة بالملفات.</p>${Object.entries(db.settings.formCustomFields||{}).map(([kind,fields])=>`<section class="card section"><h3>${esc({patient:'المريض',appointment:'الحجز',visit:'الزيارة'}[kind]||kind)}</h3>${fields.map(f=>`<div class="row"><span class="grow">${esc(f.label)} (${esc(f.type)})</span><button class="secondary" data-kind="${kind}" data-field="${f.id}">إزالة وحفظ</button></div>`).join('')}</section>`).join('')||'<p>لا توجد حقول إضافية بعد. أضفها من نموذج المريض أو الحجز أو الزيارة.</p>'}`);$('#modal').querySelectorAll('[data-field]').forEach(b=>b.onclick=async()=>{let kind=b.dataset.kind,field=db.settings.formCustomFields[kind].find(f=>f.id===b.dataset.field);db.settings.archivedFormCustomFields ||= {};db.settings.archivedFormCustomFields[kind] ||= [];if(field)db.settings.archivedFormCustomFields[kind].push(field);db.settings.formCustomFields[kind]=db.settings.formCustomFields[kind].filter(f=>f.id!==b.dataset.field);if(await confirmedSave(b))customFieldManager()});ensureBackButton()}
customFieldManager=wrapBack(customFieldManager);
const customSettingsV15=settingsPage;settingsPage=function(){customSettingsV15();if(user.role==='admin'){let b=document.createElement('button');b.textContent='إزالة الحقول الإضافية / حفظ';b.onclick=customFieldManager;$('#content').prepend(b)}};
function captureDialogInputs(){return [...$('#modal').querySelectorAll('input:not([type="file"]),select,textarea')].map((e,index)=>({index,value:e.value,checked:e.checked,tag:e.tagName,name:e.name,id:e.id}))}
function restoreDialogInputs(snapshot){let inputs=[...$('#modal').querySelectorAll('input:not([type="file"]),select,textarea')];for(let saved of snapshot||[]){let el=inputs[saved.index];if(el&&el.tagName===saved.tag&&el.name===saved.name&&el.id===saved.id){el.value=saved.value;el.checked=saved.checked}}}
function routeDialog(fn){return function(...args){if(restoringDialog)return fn(...args);if(!$('#modal').open)dialogHistory=[];let previous=dialogHistory.at(-1);if(previous)previous.snapshot=captureDialogInputs();let entry=()=>{let state=restoringDialog;restoringDialog=true;try{let result=fn(...args);restoreDialogInputs(entry.snapshot);ensureBackButton();return result}finally{restoringDialog=state}};dialogHistory.push(entry);return entry()}}
patientForm=routeDialog(patientForm);patientFile=routeDialog(patientFile);appointmentForm=routeDialog(appointmentForm);visitForm=routeDialog(visitForm);toothForm=routeDialog(toothForm);userForm=routeDialog(userForm);clinicManager=routeDialog(clinicManager);staffManager=routeDialog(staffManager);archiveStaff=routeDialog(archiveStaff);customFieldManager=routeDialog(customFieldManager);jawReferenceDialog=routeDialog(jawReferenceDialog);photoEditor=routeDialog(photoEditor);photoForm=routeDialog(photoForm);invoiceDialog=routeDialog(invoiceDialog);newBookingPayment=routeDialog(newBookingPayment);manageToothStates=routeDialog(manageToothStates);managePaymentMethods=routeDialog(managePaymentMethods);manageModules=routeDialog(manageModules);brandSettings=routeDialog(brandSettings);fieldForm=routeDialog(fieldForm);reminderForm=routeDialog(reminderForm);stockForm=routeDialog(stockForm);expenseForm=routeDialog(expenseForm);backupsDialog=routeDialog(backupsDialog);confirmRestore=routeDialog(confirmRestore);openCustomSection=routeDialog(openCustomSection);chatDialog=routeDialog(chatDialog);notificationsDialog=routeDialog(notificationsDialog);patientAvatar=routeDialog(patientAvatar);campaignDialog=routeDialog(campaignDialog);

const archivedFieldsV15=customFieldManager;customFieldManager=function(){archivedFieldsV15();if(user.role!=='admin')return;for(let [kind,fields]of Object.entries(db.settings.archivedFormCustomFields||{}))for(let field of fields){let button=document.createElement('button');button.className='secondary';button.textContent='استرجاع الحقل: '+field.label;button.onclick=async()=>{db.settings.formCustomFields[kind] ||= [];if(!db.settings.formCustomFields[kind].some(f=>f.id===field.id))db.settings.formCustomFields[kind].push(field);db.settings.archivedFormCustomFields[kind]=db.settings.archivedFormCustomFields[kind].filter(f=>f.id!==field.id);if(await confirmedSave(button))customFieldManager()};$('#modal').append(button)}};
const allPageBackV15=render;render=function(){allPageBackV15();if(!$('main')||document.querySelector('main [data-always-back]'))return;let button=document.createElement('button');button.className='secondary';button.dataset.alwaysBack='';button.textContent='← رجوع';button.disabled=page==='dashboard'&&!pageHistory.length;button.onclick=()=>{page=pageHistory.pop()||'dashboard';render()};$('.top').prepend(button)};

</script></html>
